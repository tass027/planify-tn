<div class="d-flex flex-column min-vh-100">

  <!-- Header -->
  <header class="header">
    <div class="container">
      <a routerLink="/" class="logo">
        <img src="assets/logo1.png" alt="Planify.tn Logo" loading="lazy">
        <span>Planify.tn</span>
      </a>

      <!-- Menu -->
      <button class="menu-toggle"
              aria-label="Ouvrir le menu"
              aria-controls="nav-menu"
              aria-expanded="true"
              (click)="toggleMenu()">
        <img src="assets/menu.png" alt="" aria-hidden="true" />
      </button>

      <!-- Navigation -->
      <nav aria-label="Navigation principale">
        <ul class="nav-menu" id="nav-menu" [class.active]="isMenuOpen">
          <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Accueil</a></li>
          <li class="has-submenu">
            <a routerLink="/services" routerLinkActive="active">Services</a>
            <ul class="submenu2">
              <li><a routerLink="/sorties" routerLinkActive="active">Sorties</a></li>
              <li><a routerLink="/cadeaux" routerLinkActive="active">Cadeaux</a></li>
              <li><a routerLink="/evenements" routerLinkActive="active">Évènements</a></li>
            </ul>
          </li>
          <li><a routerLink="/contact" routerLinkActive="active">Contact</a></li>
        </ul>
      </nav>


      <div class="header-actions">
        <!-- Login button -->
        <a routerLink="/login" class="login-btn">Se connecter</a>

        <!-- Cart icon -->
        <a routerLink="/panier" class="cart-btn">
          <img src="assets/cart-icon.png" alt="Panier" class="cart-icon">
          <span class="cart-count">{{ cartCount }}</span>
        </a>

        <!-- Booking icon -->
        <a routerLink="/booking" class="booking-btn">
          <img src="assets/booking-icon.png" alt="Booking" class="booking-icon">
          <span class="booking-count">{{ bookingCount }}</span>
        </a>

      </div>



    </div>
  </header>

  <!-- Page content -->
  <main class="flex-grow-1">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container text-center">
      <p>&copy; 2025 Planify.tn. Tous droits réservés.</p>
      <small>Made with ❤️ in Tunisia</small>
      <div class="socials">
        <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
        <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
        <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
      </div>
    </div>
  </footer>
</div>
